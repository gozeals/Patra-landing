<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Panel Admin — PATRA</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#14532D">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://script.google.com">
  <link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&family=Plus+Jakarta+Sans:wght@700;800&display=swap">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/admin.css">
  <script>
    // Terapkan tema sebelum render (tanpa kedip)
    (function () { try { var t = localStorage.getItem('patra:v1:theme'); if (t) document.documentElement.setAttribute('data-theme', JSON.parse(t)); } catch (e) {} })();
  </script>
</head>
<body>
  <!-- ===================== LOGIN ===================== -->
  <section class="login" id="loginView" hidden>
    <div class="login__card">
      <span class="logo" aria-label="PATRA"></span>
      <h1>Panel Admin</h1>
      <p>Masuk untuk mengelola calon pelanggan, statistik, dan konten website.</p>
      <form id="loginForm" novalidate>
        <div class="alert alert--error" id="loginError" role="alert" hidden></div>
        <div class="alert alert--info" id="demoHint" hidden><i data-ic="info" class="ic-sm"></i><span><b>Mode demo</b> (GAS_URL belum diisi). Masuk dengan <b>admin@patra.id</b> / <b>demo1234</b>, atau <b>cs@patra.id</b> / <b>demo1234</b> untuk peran Staf.</span></div>
        <div class="field">
          <label for="lEmail">Email</label>
          <input class="input" id="lEmail" type="email" autocomplete="username" inputmode="email" required placeholder="nama@patra.id">
        </div>
        <div class="field">
          <label for="lPass">Password</label>
          <div class="pw-wrap">
            <input class="input" id="lPass" type="password" autocomplete="current-password" required placeholder="••••••••">
            <button class="pw-toggle" type="button" data-pw="lPass" aria-label="Tampilkan password"><i data-ic="eye"></i></button>
          </div>
        </div>
        <button class="btn btn--primary btn--lg btn--block" type="submit" id="loginBtn">Masuk <i data-ic="arrow-right"></i></button>
      </form>
      <a class="login__back" href="index.html"><i data-ic="chevron-left" class="ic-sm"></i> Kembali ke website</a>
    </div>
  </section>

  <!-- ===================== APLIKASI ===================== -->
  <div class="shell" id="appView" hidden>
    <aside class="side" aria-label="Navigasi admin">
      <div class="side__brand">
        <span class="side__mark"><img src="assets/img/star.svg" alt=""></span>
        <span><span class="logo" aria-label="PATRA"></span><small>ADMIN CONSOLE</small></span>
      </div>
      <div class="side__label">Menu</div>
      <nav class="side__nav" id="sideNav"></nav>
      <div class="side__foot">
        <div class="side__status" id="sideStatus"><span class="dot"></span><span id="sideStatusText">Tersinkron</span></div>
      </div>
    </aside>

    <div class="main">
      <header class="top" id="topBar">
        <div class="top__brand"><span class="side__mark" style="width:34px;height:34px;border-radius:10px"><img src="assets/img/star.svg" alt="" style="width:16px;height:16px"></span></div>
        <div class="top__title" id="topTitle">Dashboard</div>
        <div class="top__actions">
          <span class="sync" id="syncState" title="Status sinkronisasi"><i data-ic="refresh"></i><span class="only-desk" id="syncText">Tersinkron</span></span>
          <button class="btn btn--icon btn--ghost" id="refreshBtn" type="button" aria-label="Muat ulang data"><i data-ic="refresh"></i></button>
          <button class="btn btn--icon btn--ghost" id="themeBtn" type="button" aria-label="Ganti tema terang/gelap"><i data-ic="moon"></i></button>
          <button class="avatar-btn" id="userBtn" type="button" aria-haspopup="menu" aria-expanded="false">
            <span class="av" id="userAv">AP</span>
            <span class="who"><b id="userName">Admin</b><small id="userRole">Admin</small></span>
          </button>
        </div>
      </header>
      <div class="menu-pop" id="userMenu" role="menu" hidden>
        <button type="button" role="menuitem" data-act="password"><i data-ic="key"></i> Ganti password</button>
        <a role="menuitem" href="index.html" target="_blank" rel="noopener"><i data-ic="external"></i> Lihat website</a>
        <hr>
        <button type="button" role="menuitem" class="danger" data-act="logout"><i data-ic="logout"></i> Keluar</button>
      </div>

      <main class="content" id="pages" tabindex="-1"></main>
    </div>

    <nav class="bnav" id="bottomNav" aria-label="Navigasi bawah"></nav>
  </div>

  <div id="layer"></div>

  <script src="assets/js/config.js" defer></script>
  <script src="assets/js/core.js" defer></script>
  <script src="assets/js/admin.js" defer></script>
</body>
</html>
